# Lokale Datenbank für Entwicklung und Tests: PostgreSQL mit PostGIS
# Start:  docker compose up -d datenbank
# Werte:  aus der lokalen .env (Vorlage: .env.example)

name: soforthilfe-bern-mittelland

services:
  datenbank:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soforthilfe}
      POSTGRES_USER: ${POSTGRES_USER:-soforthilfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in der .env setzen}
    ports:
      # Nur auf dem eigenen Rechner erreichbar, nicht im Netzwerk.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  datenbank:
