# CI: Geheimnisprüfung, Hygieneprüfung, Build und Tests
# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Die Schritte für Backend und Frontend greifen, sobald der jeweilige Code vorhanden ist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geheimnisse:
    name: Geheimnisprüfung (Gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Repository mit gesamter Historie auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks installieren und Prüfsumme kontrollieren
        run: |
          cd "$RUNNER_TEMP"
          basis="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${basis}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o pruefsummen.txt "${basis}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing pruefsummen.txt
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gesamte Historie auf Geheimnisse prüfen
        run: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml

  hygiene:
    name: Hygieneprüfung
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Alle versionierten Dateien prüfen
        run: node scripts/hygiene/pruefe-dateien.mjs --alle

      - name: Tests der Hygieneprüfung
        run: node --test "tests/hygiene/*.test.mjs"

  backend:
    name: Backend bauen und testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      datenbank:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: soforthilfe
          POSTGRES_USER: soforthilfe
          # Nur im kurzlebigen CI-Container: Anmeldung ohne Kennwort, damit kein Geheimnis im Workflow steht.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soforthilfe -d soforthilfe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: soforthilfe
      POSTGRES_USER: soforthilfe

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: .NET einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore Soforthilfe.slnx

      - name: Bauen
        run: dotnet build Soforthilfe.slnx --configuration Release --no-restore

      - name: Tests
        if: hashFiles('backend/tests/**/*.csproj') != ''
        run: dotnet test Soforthilfe.slnx --configuration Release --no-build

      - name: Werkzeuge wiederherstellen (dotnet ef)
        run: dotnet tool restore

      - name: Datenbank mit den Migrationen aufbauen
        run: >-
          dotnet ef database update
          --project src/Soforthilfe.Datenzugriff
          --startup-project src/Soforthilfe.Api
          --configuration Release
          --no-build

      - name: Schnittstelle starten
        env:
          ASPNETCORE_URLS: http://localhost:5000
        run: |
          # Ohne Startprofil, damit die CI wie ein Container in der Umgebung «Production» läuft.
          nohup dotnet run --project src/Soforthilfe.Api --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          for versuch in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health/live > /dev/null 2>&1; then
              echo "Schnittstelle ist gestartet."
              exit 0
            fi
            sleep 2
          done
          echo "Schnittstelle startet nicht."
          exit 1

      - name: Zustandsprüfung und Fehlerbehandlung prüfen
        run: |
          curl -fsS http://localhost:5000/health/live; echo
          curl -fsS http://localhost:5000/health/ready; echo
          curl -fsS http://localhost:5000/api/info; echo
          # Unbekannte Adresse: Die zentrale Fehlerbehandlung antwortet mit einem Problem-Dokument.
          status=$(curl -s -o antwort.json -w '%{http_code}' -H 'Accept: application/json' http://localhost:5000/gibt-es-nicht)
          cat antwort.json; echo
          test "$status" = "404"
          grep -q '"status":404' antwort.json

      - name: Protokoll der Schnittstelle
        if: always()
        run: cat api.log || true
