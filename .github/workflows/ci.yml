# CI: Geheimnisprüfung, Hygieneprüfung, Build und Tests
# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Die Schritte für Backend und Frontend greifen, sobald der jeweilige Code vorhanden ist.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geheimnisse:
    name: Geheimnisprüfung (Gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Repository mit gesamter Historie auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks installieren und Prüfsumme kontrollieren
        run: |
          cd "$RUNNER_TEMP"
          basis="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "${basis}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o pruefsummen.txt "${basis}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing pruefsummen.txt
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gesamte Historie auf Geheimnisse prüfen
        run: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml

  hygiene:
    name: Hygieneprüfung
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Alle versionierten Dateien prüfen
        run: node scripts/hygiene/pruefe-dateien.mjs --alle

      - name: Tests der Hygieneprüfung
        run: node --test "tests/hygiene/*.test.mjs"

  frontend:
    name: Frontend bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten genau nach Sperrdatei installieren
        run: npm ci

      - name: Bauen
        run: npm run build

  container:
    name: Containerplattform starten
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Lokale Konfiguration nur für diesen Lauf erzeugen
        run: |
          # Zufällige Werte je Lauf, in den Protokollen maskiert; die Datei .env wird nie committet.
          kennwort="$(openssl rand -hex 24)"
          schluessel="$(openssl rand -base64 48)"
          echo "::add-mask::${kennwort}"
          echo "::add-mask::${schluessel}"
          printf 'POSTGRES_PASSWORD=%s\nJWT_KEY=%s\n' "$kennwort" "$schluessel" > .env

      - name: Plattform mit einem Befehl starten
        run: docker compose --profile plattform up -d --build

      - name: Oberfläche und Schnittstelle über den Lastverteiler prüfen
        run: |
          for versuch in $(seq 1 60); do
            if curl -ksf https://localhost/health/ready > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -ksf https://localhost/health/ready; echo
          curl -ksf https://localhost/api/info; echo
          # Die Oberfläche kommt von nginx, mit den Sicherheitsköpfen.
          curl -ksf https://localhost/ | grep -q '<div id="app">'
          curl -ksI https://localhost/ | grep -qi '^content-security-policy:'
          # Das Ortschaftenverzeichnis ist im Image enthalten und beim Start eingelesen.
          curl -ksf 'https://localhost/api/orte?plz=3011' | grep -q '"ort":"Bern"'
          # HTTP wird auf HTTPS umgeleitet.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          test "$status" = "301" -o "$status" = "308"

      - name: Protokolle der Container
        if: always()
        run: docker compose --profile plattform logs --no-color

      - name: Plattform beenden
        if: always()
        run: docker compose --profile plattform down -v

  backend:
    name: Backend bauen und testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      datenbank:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: soforthilfe
          POSTGRES_USER: soforthilfe
          # Nur im kurzlebigen CI-Container: Anmeldung ohne Kennwort, damit kein Geheimnis im Workflow steht.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soforthilfe -d soforthilfe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: soforthilfe
      POSTGRES_USER: soforthilfe

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Schlüssel und Testpasswort nur für diesen Lauf erzeugen
        run: |
          # Zufällig je Lauf und in den Protokollen maskiert; es steht nie ein Schlüssel im Repository.
          schluessel="$(openssl rand -base64 48)"
          kennwort="$(openssl rand -base64 24)"
          echo "::add-mask::${schluessel}"
          echo "::add-mask::${kennwort}"
          echo "JWT_KEY=${schluessel}" >> "$GITHUB_ENV"
          echo "TESTDATEN_PASSWORT=${kennwort}" >> "$GITHUB_ENV"

      - name: .NET einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore Soforthilfe.slnx

      - name: Bauen
        run: dotnet build Soforthilfe.slnx --configuration Release --no-restore

      - name: Tests
        if: hashFiles('backend/tests/**/*.csproj') != ''
        run: dotnet test --solution Soforthilfe.slnx --configuration Release --no-build

      - name: Werkzeuge wiederherstellen (dotnet ef)
        run: dotnet tool restore

      - name: Datenbank mit den Migrationen aufbauen
        run: >-
          dotnet ef database update
          --project src/Soforthilfe.Datenzugriff
          --startup-project src/Soforthilfe.Api
          --configuration Release
          --no-build

      - name: Schnittstelle mit Testdaten starten
        env:
          ASPNETCORE_URLS: http://localhost:5000
          Testdaten__Laden: "true"
        run: |
          # Ohne Startprofil, damit die CI wie ein Container in der Umgebung «Production» läuft.
          nohup dotnet run --project src/Soforthilfe.Api --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          for versuch in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health/live > /dev/null 2>&1; then
              echo "Schnittstelle ist gestartet."
              exit 0
            fi
            sleep 2
          done
          echo "Schnittstelle startet nicht."
          exit 1

      - name: Zustandsprüfung und Fehlerbehandlung prüfen
        run: |
          curl -fsS http://localhost:5000/health/live; echo
          curl -fsS http://localhost:5000/health/ready; echo
          curl -fsS http://localhost:5000/api/info; echo
          # Unbekannte Adresse: Die zentrale Fehlerbehandlung antwortet mit einem Problem-Dokument.
          status=$(curl -s -o antwort.json -w '%{http_code}' -H 'Accept: application/json' http://localhost:5000/gibt-es-nicht)
          cat antwort.json; echo
          test "$status" = "404"
          grep -q '"status":404' antwort.json
          grep -q '"fehler":' antwort.json

      - name: Stammdaten und Testdaten prüfen
        run: |
          zaehle() { psql -h localhost -U soforthilfe -d soforthilfe -tAc "SELECT COUNT(*) FROM \"$1\""; }
          pruefe() {
            anzahl=$(zaehle "$1")
            echo "$1: $anzahl (erwartet $2)"
            test "$anzahl" = "$2"
          }
          pruefe Regionen 2
          pruefe Kategorien 10
          pruefe Skills 10
          pruefe Konten 8
          pruefe Helferprofile 3
          pruefe Anfragen 2
          # Nach dem Start steht im Protokoll nur das Einlesen des Ortschaftenverzeichnisses.
          pruefe Protokoll 1
          # Amtliches Ortschaftenverzeichnis von swisstopo, jede Zeile der Ausgabe.
          pruefe Ortschaften 5718
          # Alle Testpersonen sind fiktiv: Ihre Adressen enden auf «.invalid».
          pruefe_fiktiv=$(psql -h localhost -U soforthilfe -d soforthilfe -tAc "SELECT COUNT(*) FROM \"Konten\" WHERE \"EMail\" NOT LIKE '%@beispiel.invalid'")
          test "$pruefe_fiktiv" = "0"

      - name: Rauchtest der Schnittstelle
        working-directory: .
        env:
          API_URL: http://localhost:5000
        run: bash tests/rauchtest/schnittstelle.sh

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Schnittstellentests
        working-directory: .
        env:
          API_URL: http://localhost:5000
        run: node --test "tests/api/*.test.mjs"

      - name: Oberfläche bauen und als Vorschau starten
        working-directory: frontend
        env:
          API_URL: http://localhost:5000
        run: |
          npm ci
          npm run build
          # Die Vorschau leitet /api an die laufende Schnittstelle weiter, mit denselben Sicherheitsköpfen wie im Betrieb.
          nohup npx vite preview --port 4173 --strictPort > ../vorschau.log 2>&1 &
          for versuch in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4173/ > /dev/null

      - name: Playwright mit Chromium einrichten
        working-directory: tests/oberflaeche
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Oberflächentests
        working-directory: tests/oberflaeche
        env:
          OBERFLAECHE_URL: http://localhost:4173
        run: npx playwright test

      - name: Protokoll der Schnittstelle
        if: always()
        run: cat api.log || true
