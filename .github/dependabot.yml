# Dependabot: wöchentliche Prüfung der Abhängigkeiten

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "Abhängigkeiten"

  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/tests/oberflaeche"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "Abhängigkeiten"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "Abhängigkeiten"

  # Basis-Images der Dockerfiles von Schnittstelle und Oberfläche.
  # Node.js bleibt auf der Version mit Langzeitunterstützung (22); neue Hauptversionen nur nach Entscheid.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "Abhängigkeiten"
