# Auslieferung der Vue-Anwendung hinter dem Lastverteiler.
# Die Schnittstelle (/api) leitet der Lastverteiler direkt an die API weiter.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Dateien mit Prüfsumme im Namen dürfen lange zwischengespeichert werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/sicherheit.conf;
        try_files $uri =404;
    }

    # Service Worker und Einstiegsseite immer frisch laden, damit Updates sofort wirken.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/sicherheit.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/sicherheit.conf;
    }

    # Single-Page-Anwendung: unbekannte Pfade liefern index.html (Routing im Browser).
    location / {
        include /etc/nginx/sicherheit.conf;
        try_files $uri $uri/ /index.html;
    }
}
